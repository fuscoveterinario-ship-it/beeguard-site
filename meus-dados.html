<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus dados</title>
<link rel="stylesheet" href="style.css?v=2026102402">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bee Guard">
<meta name="theme-color" content="#111111">
</head>
<body>
<header><a class="marca" href="index.html"><img src="icone.png" alt="" width="40" height="40"><span>BEEGUARD<small>Meus dados</small></span></a></header>
<main>
  <section class="card" id="login"><p class="msg">Carregando… (precisa de internet)</p></section>
  <section class="card" id="dados" hidden></section>
  <a class="btn secundario" href="painel.html">Voltar ao painel</a>
</main>
<script type="module">
import { $, show, sb, ensureLogin } from "./app.js?v=2026102402";
import { formDados } from "./dados.js?v=2026102402";

function desenhar(perfil, salvo = false) {
  formDados($("#dados"), {
    perfil, apagar: true,
    aoSalvar: (p) => desenhar(p, true),
  });
  if (salvo) $("#dados [data-erro]").insertAdjacentHTML("beforebegin", `<p class="msg">✓ Salvo.</p>`);
}

ensureLogin($("#login"), async () => {
  show("#login", false);
  const { data } = await sb.rpc("colmeia_my_profile");
  desenhar(data || {});
  show("#dados");
});
</script>
</body>
</html>
