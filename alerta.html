<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alerta da colmeia</title>
<link rel="stylesheet" href="style.css?v=2026102406">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bee Guard">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body data-aba="alertas">
<header><a class="marca" href="index.html"><img src="icone.png" alt="" width="40" height="40"><span>BEEGUARD<small>Alerta de movimento</small></span></a></header>
<main>
  <section class="card" id="carregando"><p>Carregando alerta…</p></section>
  <p class="erro card" id="erro" hidden></p>

  <section class="card" id="alerta" hidden>
    <h1 id="titulo"></h1>
    <p id="situacao"></p>
    <div class="grid">
      <div><span>Apiário</span><b id="a-apiario"></b></div>
      <div><span>Última mensagem</span><b id="a-quando"></b></div>
      <div><span>Bateria</span><b id="a-bat"></b></div>
      <div><span>Modo</span><b id="a-modo"></b></div>
    </div>
    <p id="a-balanca" hidden></p>
    <div id="acoes">
      <button class="ok" data-acao="manutencao">Sou eu (manutenção ou colheita)</button>
      <button class="perigo" data-acao="roubo">Possível roubo</button>
    </div>
    <p class="msg" id="acao-msg"></p>
    <a class="btn secundario" id="bo" hidden>Boletim de ocorrência (PDF, com login do dono)</a>
  </section>

  <section class="card" id="mapa-card" hidden>
    <h2>Mapa</h2>
    <div id="map"></div>
    <a class="btn secundario" id="abrir-maps" target="_blank">Abrir no Google Maps</a>
    <p class="msg">A página atualiza sozinha a cada 30 segundos.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { $, show, sb, ago, batteryPct, errorText, mapsLink } from "./app.js?v=2026102406";

const token = new URLSearchParams(location.search).get("t") || "";
let map, line, marker;

// Possível furto de mel: a caixa continua no lugar, mas o peso caiu depois de mexerem nela.
const TEXTOS_MEL = {
  pendente: ["Possível furto de mel", "Mexeram na caixa e o peso caiu de repente. Foi você colhendo? Se ninguém responder em 5 minutos, o contato secundário é avisado."],
  escalado: ["POSSÍVEL FURTO DE MEL", "Mexeram na caixa, o peso caiu e ninguém confirmou em 5 minutos."],
  roubo_confirmado: ["FURTO DE MEL CONFIRMADO", "Gere o boletim de ocorrência. Para encerrar o alerta, entre no painel do Bee Guard."],
  manutencao: ["Colheita confirmada", "Alerta encerrado. Mexer nas caixas nas próximas 2 horas não gera alerta."],
  encerrado: ["Alerta encerrado", ""],
};
const TEXTOS = {
  pendente: ["A caixa foi movimentada", "Foi você fazendo manutenção? Se ninguém responder em 5 minutos, o contato secundário é avisado e o rastreamento intensivo começa."],
  escalado: ["POSSÍVEL ROUBO", "Ninguém confirmou em 5 minutos. O rastreador está enviando a posição com frequência."],
  roubo_confirmado: ["ROUBO CONFIRMADO", "O rastreador está enviando a posição com frequência. Acompanhe no mapa. Para encerrar o alerta, entre no painel do Bee Guard."],
  manutencao: ["Manutenção confirmada", "Alerta encerrado. Novos movimentos nas próximas 2 horas não geram alerta."],
  encerrado: ["Alerta encerrado", ""],
};

async function carregar(acao = "ver") {
  const { data, error } = await sb.rpc("colmeia_respond_alert", { p_token: token, p_action: acao });
  show("#carregando", false);
  if (error) {
    $("#erro").textContent = errorText(error);
    show("#erro");
    return null;
  }
  render(data);
  return data;
}

function render({ alert, device, track, balanca }) {
  show("#alerta");
  const [titulo, texto] = alert.kind === "movimento" || alert.kind === "furto_mel"
    ? (alert.kind === "furto_mel" ? TEXTOS_MEL : TEXTOS)[alert.status] || [alert.status, ""]
    : [alert.kind === "offline" ? "Rastreador sem comunicação" : "Bateria baixa", "Verifique o rastreador no apiário."];
  $("#titulo").textContent = `${titulo}: ${device.caixa}`;
  $("#situacao").textContent = texto;
  $("#a-apiario").textContent = device.apiario || "—";
  $("#a-quando").textContent = ago(device.last_seen_at);
  const pct = batteryPct(device.battery_mv);
  $("#a-bat").textContent = pct === null ? "—" : `${pct}%`;
  $("#a-modo").textContent = device.mode === "roubo" ? "rastreamento intensivo" : "normal";

  // Colmeia com balança: peso antes e na hora do movimento.
  const fmt = (v) => `${Number(v).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} kg`;
  if (balanca && balanca.antes !== null && balanca.no_alerta !== null) {
    const tirada = Number(balanca.no_alerta) < Number(balanca.antes) * 0.3;
    $("#a-balanca").textContent = `Balança: ${fmt(balanca.antes)} antes, ${fmt(balanca.no_alerta)} na hora do movimento.` +
      (tirada ? " A caixa foi tirada da balança." : "");
    $("#a-balanca").className = tirada ? "erro" : "msg";
    show("#a-balanca");
  }

  // Roubo confirmado só se encerra no painel (com login): o link da mensagem passa a só mostrar o mapa.
  const roubo = ["movimento", "furto_mel"].includes(alert.kind);
  const podeResponder = roubo && ["pendente", "escalado"].includes(alert.status);
  show("#acoes", podeResponder);
  // Possível roubo: o dono gera o relatório para a delegacia (a página pede login).
  $("#bo").href = `ocorrencia.html?d=${encodeURIComponent(device.id)}`;
  show("#bo", roubo && ["escalado", "roubo_confirmado"].includes(alert.status));

  const pts = track.map((p) => [p.lat, p.lon]);
  if (!pts.length && device.lat) pts.push([device.lat, device.lon]);
  if (!pts.length || !window.L) return;
  show("#mapa-card");
  const last = pts[pts.length - 1];
  $("#abrir-maps").href = mapsLink(last[0], last[1]);
  if (!map) {
    map = L.map("map");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap",
    }).addTo(map);
    line = L.polyline(pts, { color: "#c62828" }).addTo(map);
    marker = L.marker(last).addTo(map);
    map.setView(last, 16);
  } else {
    line.setLatLngs(pts);
    marker.setLatLng(last);
  }
}

document.querySelectorAll("#acoes button").forEach((b) => {
  b.onclick = async () => {
    b.disabled = true;
    const data = await carregar(b.dataset.acao);
    b.disabled = false;
    if (data) {
      $("#acao-msg").textContent = "Resposta registrada.";
      sb.functions.invoke("colmeia-dispatch").catch(() => {}); // envia avisos na hora
    }
  };
});

if (!token) {
  show("#carregando", false);
  $("#erro").textContent = "Link incompleto. Abra o link exatamente como veio na mensagem.";
  show("#erro");
} else {
  carregar();
  setInterval(() => carregar(), 30000);
}
</script>
<script type="module" src="nav.js?v=2026102406"></script>
</body>
</html>
